apiVersion: batch/v1
kind: Job
metadata:
  namespace: razvanlab
  name: mars-jepa-pointmaze
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: jepa
        image: docker.io/samkash/mars-runtime:uv3
        args:
        - python
        - /opt/cluster/jepa_plan.py
        - --episodes
        - '2'
        env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility,graphics
        - name: WANDB_MODE
          value: offline
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 40Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 40Gi
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: data
          mountPath: /data
        - name: runtime
          mountPath: /runtime
        - name: shm
          mountPath: /dev/shm
        - name: scratch
          mountPath: /tmp
        command:
        - /bin/bash
        - /opt/cluster/jepa-run.sh
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mars-world-data
      - name: runtime
        emptyDir:
          sizeLimit: 35Gi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: scratch
        emptyDir:
          sizeLimit: 5Gi
      initContainers:
      - name: setup
        image: docker.io/samkash/mars-runtime:uv3
        command:
        - /bin/bash
        - /opt/cluster/runtime-setup.sh
        args:
        - jepa
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 40Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: runtime
          mountPath: /runtime
